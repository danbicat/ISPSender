# ISPSender 1.2 — ASN -> country -> default -> emergency fallback.
# Every pool accepts a string or a YAML list. Duplicates add weight.
# Existing configurations remain compatible; missing keys use these defaults.

token: "YOUR_IPINFO_TOKEN" # IPINFO_TOKEN environment variable takes priority.
database-url: "https://ipinfo.io/data/ipinfo_lite.mmdb?token={token}"
database-file: "ipinfo_lite.mmdb"

# Download once per date at 00:00 in this timezone. A missing/corrupt DB or a
# missed day is caught up at startup. Same-day restarts reuse the cached DB.
# Failed downloads retain the old DB and retry after five minutes.
database-timezone: "Asia/Seoul"
connect-timeout-seconds: 15
read-timeout-seconds: 180

# Legacy keys are accepted but no longer override the daily update policy.
update-on-start: true
update-interval-minutes: 0

# Health checks run every 10 seconds on every distinct server (fallback too).
# minecraft sends a Minecraft status request and needs a status reply (recommended).
# tcp only checks that the port accepts connections; use it for non-Minecraft targets.
# Unknown, failed, or stale (>30 seconds) checks are excluded from all pools.
health-check-mode: "minecraft"
health-check-timeout-millis: 2000
# A server leaves the pools after this many consecutive failed checks (1-10).
health-failure-threshold: 2
log-lookups: true
# JSONL connection logs are always recorded independently of console logging.
connection-log-retention-days: 30

asn-servers:
  "AS4766":
    - "kt1.example.com:25565"
    - "kt2.example.com:25565"
  "AS9318": "lgu.example.com:25565"
country-servers:
  "KR":
    - "kr1.example.com:25565"
    - "kr2.example.com:25565"
  "JP": "jp.example.com:25565"

# Multiple default servers work in the same way as ASN/country pools.
default-server:
  - "global1.example.com:25565"
  - "global2.example.com:25565"

# Used only after all applicable ordinary pools are unavailable.
# If disabled, empty or entirely down, the player is kicked instead.
# Console: fallback on | fallback off | fallback status (persisted to config.yml).
fallback-enabled: true
fallback-servers: []
#  - "backup1.example.com:25565"
#  - "backup2.example.com:25565"
no-server-message: "<red>No server is available for your connection."

# Discord alerts for servers going down or back up, and for players with no route.
# Messages never mention anyone. ISPSENDER_DISCORD_WEBHOOK takes priority over the URL.
# A blank value keeps the saved URL; use discord-alerts-enabled: false to stop alerts.
discord-alerts-enabled: false
discord-webhook-url: ""

# Optional private management panel. Configure a password before enabling.
# Recommended: loopback + `tailscale serve --bg http://127.0.0.1:8080`.
# Or set web-bind to this host's Tailscale IP for direct tailnet access.
# Public/wildcard/LAN bind addresses are rejected. Never use Tailscale Funnel.
# Web listener/password and database-file changes require a proxy restart.
web-enabled: false
web-bind: "127.0.0.1"
web-port: 8080
# ISPSENDER_WEB_PASSWORD environment variable takes priority. Minimum 12 chars.
web-password: ""
